<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>NeuroMap AI</title>

<link rel="stylesheet" href="style.css">

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://unpkg.com/force-graph"></script>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
</head>

<body>

<header class="header">
  <h1>NeuroMap AI</h1>
  <button class="mode-btn" onclick="toggleMode()">Switch to Recruiter</button>
</header>

<section class="hero">
  <input id="username" placeholder="GitHub username or team (comma separated)">
  <button onclick="analyze()">Analyze</button>
</section>

<div id="loading">Analyzing Intelligence...</div>

<section class="dashboard">

  <div class="card">
    <img id="avatar">
    <h2 id="name"></h2>
    <p id="bio"></p>
  </div>

  <div class="card">
    <h3>Developer Score</h3>
    <div id="score">0</div>
    <p id="level"></p>
    <p id="readiness"></p>
  </div>

  <div class="card" id="badges"></div>
  <div class="card" id="bestRepo"></div>
  <div class="card" id="domainPanel"></div>
  <div class="card" id="aiInsights"></div>
  <div class="card" id="growthPanel"></div>

  <div class="card"><canvas id="barChart"></canvas></div>

</section>

<section class="graph-section">
  <div id="graph"></div>
</section>

<script src="script.js"></script>
</body>
</html>
